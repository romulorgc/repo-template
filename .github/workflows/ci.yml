name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Detect project
        id: project
        run: if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "No package.json yet, nothing to check."; fi
      - uses: actions/setup-node@v7
        if: steps.project.outputs.node == 'true'
        with:
          node-version: 24
      - name: Install
        if: steps.project.outputs.node == 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        if: steps.project.outputs.node == 'true'
        run: npm run typecheck --if-present
      - name: Lint
        if: steps.project.outputs.node == 'true'
        run: npm run lint --if-present
      - name: Test
        if: steps.project.outputs.node == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.project.outputs.node == 'true'
        run: npm run build --if-present
